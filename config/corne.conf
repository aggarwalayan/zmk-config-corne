# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Change default keyboard display name
CONFIG_ZMK_KEYBOARD_NAME="Corne"

CONFIG_ZMK_EXT_POWER=y

# OLED related configurations
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_SYSTEM=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=64
# CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=128

CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n

CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=y

# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_WPM=y

# CONFIG_ZMK_WIDGET_WPM_STATUS=y